[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_llm_manager"
version = "0.1.0"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
	"openai>=1.68,<2",
	"python-dotenv==1.0.1",
	"tiktoken>=0.13",
	"pandas==2.2.3",
	"langchain==0.3.14",
	"langchain-openai==0.2.14",
	"langchain-community==0.3.14",
	"langchain-chroma>=0.1.4",
	"chromadb",
	"pypdf==5.1.0",
	"numpy<2",
	"protobuf==3.20.3",
	"blinker==1.5"
]

[tool.setuptools.packages.find]
where = ["src"]